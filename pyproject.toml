[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hensel_lifting"
version = "0.1.0"
description = "Hensel lifting of polynomial roots and square roots modulo prime powers and composites."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ankit Chaudhary", email = "ankit.work8881@gmail.com" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
